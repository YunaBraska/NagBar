name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (default: UTC date %Y.%m.%j%H%M)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Toolchain versions
        run: |
          set -eu
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Generate version
        id: version
        run: |
          set -eu
          version="$(./script/cicd/release_version.sh "${{ inputs.version }}")"
          printf 'tag=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        run: |
          set -eu
          ./script/cicd/set_release_version.sh "${{ steps.version.outputs.tag }}"
          ./script/cicd/prepare_changelog_release.sh "${{ steps.version.outputs.tag }}"

      - name: Check shell helper syntax
        run: |
          set -eu
          find script -name '*.sh' -exec sh -n {} +

      - name: Test
        run: ./script/build_and_run.sh --test

      - name: Commit release metadata
        run: |
          set -eu
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md NagBar.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo "Release metadata already current."
          else
            git commit -m "Release ${{ steps.version.outputs.tag }} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build release
        run: ./script/build_and_run.sh --release-build

      - name: Configure Signing
        id: signing
        run: |
          set -eu
          test -n "$MACOS_SIGNING_CERTIFICATE"
          test -n "$MACOS_SIGNING_CERTIFICATE_PASSWORD"
          test -n "$MACOS_NOTARY_KEY"
          test -n "$MACOS_NOTARY_KEY_ID"
          test -n "$MACOS_NOTARY_ISSUER_ID"

          credentials_dir=$(mktemp -d "$RUNNER_TEMP/nagbar-signing.XXXXXX")
          trap 'rm -rf "$credentials_dir"' EXIT INT TERM
          keychain_path="$RUNNER_TEMP/nagbar-signing.keychain-db"
          keychain_password=$(uuidgen)
          certificate_path="$credentials_dir/developer-id.p12"
          notary_key_path="$credentials_dir/AuthKey.p8"

          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 -D > "$certificate_path"
          printf '%s' "$MACOS_NOTARY_KEY" > "$notary_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security import "$certificate_path" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | sed -n '1p')
          test -n "$identity"
          xcrun notarytool store-credentials nagbar-notary \
            --key "$notary_key_path" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID"
          {
            printf 'identity=%s\n' "$identity"
            printf 'notary_profile=nagbar-notary\n'
          } >> "$GITHUB_OUTPUT"
          printf 'identity=%s\n' "$identity"
          printf 'notary_profile=nagbar-notary\n'

      - name: Sign and notarize Developer ID artifact
        run: |
          set -eu
          ./script/cicd/sign_release.sh --developer-id "${{ steps.signing.outputs.identity }}"
          ./script/cicd/notarize_release.sh --keychain-profile "${{ steps.signing.outputs.notary_profile }}"
          ./script/cicd/package_release.sh --developer-id --skip-build

      - name: Collect release artifacts
        id: artifacts
        run: |
          set -eu
          set -- dist/NagBar-*-macOS.zip
          test "$1" != 'dist/NagBar-*-macOS.zip'
          test "$#" -eq 1
          zip_path=$1
          checksum_path="$zip_path.sha256"
          manifest_path="$zip_path.manifest"
          test -f "$zip_path"
          test -f "$checksum_path"
          test -f "$manifest_path"
          {
            printf 'zip=%s\n' "$zip_path"
            printf 'checksum=%s\n' "$checksum_path"
            printf 'manifest=%s\n' "$manifest_path"
          } >> "$GITHUB_OUTPUT"
          printf 'zip=%s\n' "$zip_path"
          printf 'checksum=%s\n' "$checksum_path"
          printf 'manifest=%s\n' "$manifest_path"

      - name: Extract release notes
        run: ./script/cicd/extract_changelog_release_notes.sh "${{ steps.version.outputs.tag }}" > release-notes.md

      - name: Tag release commit
        run: |
          set -eu
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NagBar ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            ${{ steps.artifacts.outputs.zip }}
            ${{ steps.artifacts.outputs.checksum }}
            ${{ steps.artifacts.outputs.manifest }}
          draft: false
          prerelease: false

      - name: Clean Signing Credentials
        if: always()
        run: |
          set -eu
          security delete-keychain "$RUNNER_TEMP/nagbar-signing.keychain-db" >/dev/null 2>&1 || rm -f "$RUNNER_TEMP/nagbar-signing.keychain-db"
