name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (default: UTC date %Y.%m.%j%H%M)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          set -eu
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Generate version
        id: version
        run: |
          set -eu
          version="$(./script/cicd/release_version.sh "${{ inputs.version }}")"
          printf 'tag=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        run: |
          set -eu
          ./script/cicd/set_release_version.sh "${{ steps.version.outputs.tag }}"
          ./script/cicd/prepare_changelog_release.sh "${{ steps.version.outputs.tag }}"

      - name: Check shell helper syntax
        run: |
          set -eu
          find script -name '*.sh' -exec sh -n {} +

      - name: Test
        run: ./script/build_and_run.sh --test

      - name: Commit release metadata
        run: |
          set -eu
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md NagBar.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo "Release metadata already current."
          else
            git commit -m "Release ${{ steps.version.outputs.tag }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build release
        run: ./script/build_and_run.sh --release-build

      - name: Detect signing mode
        id: signing
        run: |
          set -eu
          if [ -n "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" ] \
            && [ -n "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" ] \
            && [ -n "$MACOS_DEVELOPER_ID_IDENTITY" ] \
            && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_TEAM_ID" ] \
            && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            printf 'mode=developer-id\n' >> "$GITHUB_OUTPUT"
          else
            printf 'mode=local\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          set -eu
          keychain_path="$RUNNER_TEMP/nagbar-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/nagbar-developer-id.p12"
          security create-keychain -p "$RUNNER_TEMP" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain_path"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security import "$certificate_path" -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$keychain_path"

      - name: Sign and notarize Developer ID artifact
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          set -eu
          ./script/cicd/sign_release.sh --developer-id "$MACOS_DEVELOPER_ID_IDENTITY"
          ./script/cicd/notarize_release.sh --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password-env APPLE_APP_SPECIFIC_PASSWORD
          ./script/cicd/package_release.sh --developer-id --skip-build

      - name: Package local/private artifact
        if: steps.signing.outputs.mode == 'local'
        run: ./script/cicd/package_release.sh --local --skip-build

      - name: Collect release artifacts
        id: artifacts
        run: |
          set -eu
          zip_path="$(ls -1 dist/NagBar-*-macOS.zip | tail -n 1)"
          checksum_path="$zip_path.sha256"
          manifest_path="$zip_path.manifest"
          test -f "$zip_path"
          test -f "$checksum_path"
          test -f "$manifest_path"
          printf 'zip=%s\n' "$zip_path" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum_path" >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: ./script/cicd/extract_changelog_release_notes.sh "${{ steps.version.outputs.tag }}" > release-notes.md

      - name: Tag release commit
        run: |
          set -eu
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NagBar ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            ${{ steps.artifacts.outputs.zip }}
            ${{ steps.artifacts.outputs.checksum }}
            ${{ steps.artifacts.outputs.manifest }}
          draft: false
          prerelease: false
