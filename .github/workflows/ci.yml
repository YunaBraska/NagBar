name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify CocoaPods is not required
        run: |
          test ! -f Podfile
          test ! -f Podfile.lock
          ! grep -ER "Pods\\.xcodeproj|Pods_|Pods/" NagBar.xcworkspace NagBar.xcodeproj

      - name: Check shell helper syntax
        run: find script -name '*.sh' -exec sh -n {} +

      - name: Check release helper paths
        run: |
          ./script/cicd/release_version.sh 2026.07.0010000
          ./script/cicd/extract_changelog_release_notes.sh 2026.07.1820815 >/tmp/nagbar-release-notes.md

      - name: Test
        run: ./script/build_and_run.sh --test

      - name: Build release
        run: ./script/build_and_run.sh --release-build

      - name: Check public release credential diagnostics
        run: |
          if ./script/cicd/sign_release.sh 2>signing.err; then
            echo 'Public signing unexpectedly succeeded without credentials.' >&2
            exit 1
          fi
          grep -F "Developer ID identity is required for public signing." signing.err
          if ./script/cicd/notarize_release.sh --app build/Release/NagBar.app 2>notary.err; then
            echo 'Notarization unexpectedly succeeded without credentials.' >&2
            exit 1
          fi
          grep -F "Apple notarization credentials are required." notary.err
